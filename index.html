  <title>Dashboard Kinh Doanh Điện Máy - Professional</title>

  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --sidebar-bg: #0f172a;
      --sidebar-width: 260px;
      --bg-dashboard: #f1f5f9;
      --card-radius: 16px;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    body { 
      font-family: 'Inter', sans-serif; 
      background-color: var(--bg-dashboard); 
      color: var(--text-main); 
      margin: 0; 
      padding: 0; 
      overflow-x: hidden; 
    }

    .app-wrapper { display: flex; min-height: 100vh; }

    /* SIDEBAR HIỆN ĐẠI */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      color: #94a3b8;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 1000;
      box-shadow: 4px 0 25px rgba(0,0,0,0.05);
    }

    .sidebar-brand { 
      padding: 24px 20px; 
      font-size: 1.15rem; 
      font-weight: 700; 
      color: #ffffff;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08); 
    }

    .sidebar-menu { list-style: none; padding: 20px 12px; margin: 0; flex-grow: 1; }
    .sidebar-menu .menu-item { margin-bottom: 8px; }

    .sidebar-menu .menu-link {
      display: flex; align-items: center; padding: 12px 16px; 
      color: #94a3b8; text-decoration: none; border-radius: 12px; 
      font-weight: 500; font-size: 0.9rem; transition: all 0.2s ease-in-out;
    }
    .sidebar-menu .menu-link i { width: 24px; font-size: 1.1rem; margin-right: 12px; transition: transform 0.2s; }
    .sidebar-menu .menu-link:hover { background: rgba(255,255,255,0.05); color: #ffffff; }
    .sidebar-menu .menu-link:hover i { transform: scale(1.1); }
    .sidebar-menu .menu-link.active { 
      background: linear-gradient(135deg, var(--primary-color) 0%, #6366f1 100%); 
      color: #ffffff; 
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); 
    }

    .main-content { 
      flex-grow: 1; 
      margin-left: var(--sidebar-width); 
      padding: 24px; 
      width: calc(100% - var(--sidebar-width)); 
    }

    /* TOP BAR */
    .top-bar {
      background: #ffffff; 
      border-radius: var(--card-radius); 
      padding: 16px 24px; 
      margin-bottom: 24px;
      box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03); 
      border: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
    }

    .nav-pills-store { background: #f8fafc; padding: 6px; border-radius: 20px; border: 1px solid var(--border-color); display: inline-flex; }
    .nav-pills-store .nav-link { border-radius: 16px; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; padding: 8px 18px; transition: all 0.2s; }
